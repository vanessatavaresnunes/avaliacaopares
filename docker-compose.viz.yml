version: '3.9'

services:
  visualizador:
    build: .
    container_name: avaliacao-pares-visualizador
    command: streamlit run visualizador_mvc.py --server.address=0.0.0.0 --server.port=${VIZ_PORT:-8502}
    ports:
      - "${VIZ_PORT:-8502}:${VIZ_PORT:-8502}"
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${VIZ_PORT:-8502} >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

