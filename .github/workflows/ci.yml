name: CI - Testes e Qualidade de Código

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11"]

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache de dependências pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov black flake8 mypy

    - name: Verificar formatação com Black
      run: |
        black --check src/ tests/
      continue-on-error: false

    - name: Verificar estilo com Flake8
      run: |
        flake8 src/ tests/ --max-line-length=88 --ignore=E203,W503
      continue-on-error: false

    - name: Verificar tipos com MyPy
      run: |
        mypy src/ --ignore-missing-imports
      continue-on-error: true  # MyPy pode ser opcional inicialmente

    - name: Executar testes unitários
      run: |
        python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

    - name: Upload de cobertura para Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Instalar Bandit (Security Linter)
      run: |
        pip install bandit[toml]

    - name: Executar verificação de segurança
      run: |
        bandit -r src/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Upload de relatório de segurança
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-report
        path: bandit-report.json

  build-check:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verificar se aplicação inicia
      run: |
        timeout 30s streamlit run app.py --server.headless true --server.port 8501 || exit 0
        echo "✅ Aplicação consegue inicializar"

    - name: Verificar estrutura de arquivos essenciais
      run: |
        echo "🔍 Verificando arquivos essenciais..."
        test -f app.py || (echo "❌ app.py não encontrado" && exit 1)
        test -f requirements.txt || (echo "❌ requirements.txt não encontrado" && exit 1)
        test -d src/ || (echo "❌ pasta src/ não encontrada" && exit 1)
        test -d data/ || (echo "❌ pasta data/ não encontrada" && exit 1)
        test -d tests/ || (echo "❌ pasta tests/ não encontrada" && exit 1)
        echo "✅ Todos os arquivos essenciais estão presentes"

  notify-status:
    runs-on: ubuntu-latest
    needs: [test, security-scan, build-check]
    if: always()
    steps:
    - name: Notificar status
      run: |
        if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.build-check.result }}" == "success" ]; then
          echo "🎉 Todos os testes passaram! PR pode ser merged."
        else
          echo "❌ Alguns testes falharam. Corrija antes de fazer merge."
          exit 1
        fi