name: Branch Protection - Merge Guard

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pre-merge-validation:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch completo para análise de diff

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Instalar dependências de teste
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov

    - name: Executar testes obrigatórios
      id: tests
      run: |
        echo "🧪 Executando testes obrigatórios para merge..."
        python -m pytest tests/ -v --tb=short
        echo "test_status=success" >> $GITHUB_OUTPUT

    - name: Verificar cobertura mínima
      run: |
        echo "📊 Verificando cobertura de código..."
        coverage_percent=$(python -m pytest tests/ --cov=src --cov-report=term | grep "TOTAL" | awk '{print $4}' | sed 's/%//')
        echo "Cobertura atual: ${coverage_percent}%"
        
        # Definir cobertura mínima (ajuste conforme necessário)
        min_coverage=15
        
        if (( $(echo "$coverage_percent >= $min_coverage" | bc -l) )); then
          echo "✅ Cobertura de ${coverage_percent}% está acima do mínimo de ${min_coverage}%"
        else
          echo "❌ Cobertura de ${coverage_percent}% está abaixo do mínimo de ${min_coverage}%"
          exit 1
        fi

    - name: Verificar arquivos críticos não modificados indevidamente
      run: |
        echo "🔒 Verificando se arquivos críticos não foram modificados indevidamente..."
        
        # Lista de arquivos que precisam de atenção especial
        critical_files=(".env" "requirements.txt" "data/config.json")
        
        for file in "${critical_files[@]}"; do
          if git diff --name-only origin/main...HEAD | grep -q "^$file$"; then
            echo "⚠️  Arquivo crítico modificado: $file"
            echo "   Certifique-se de que a modificação é necessária e segura."
          fi
        done

    - name: Validar estrutura do projeto
      run: |
        echo "🏗️  Validando estrutura do projeto..."
        
        required_dirs=("src/" "tests/" "data/" "docs/")
        required_files=("app.py" "requirements.txt" "README.md")
        
        for dir in "${required_dirs[@]}"; do
          if [ ! -d "$dir" ]; then
            echo "❌ Diretório obrigatório ausente: $dir"
            exit 1
          fi
        done
        
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ Arquivo obrigatório ausente: $file"
            exit 1
          fi
        done
        
        echo "✅ Estrutura do projeto está válida"

    - name: Comentar no PR com resultado
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const { github } = require('@actions/github');
          
          let message = '';
          
          if ('${{ steps.tests.outputs.test_status }}' === 'success') {
            message = `## ✅ Validação de Merge - APROVADA
            
            - ✅ Todos os testes passaram
            - ✅ Cobertura de código adequada
            - ✅ Estrutura do projeto válida
            
            **Este PR está pronto para merge!** 🚀`;
          } else {
            message = `## ❌ Validação de Merge - REPROVADA
            
            - ❌ Alguns testes falharam
            
            **Corrija os problemas antes de fazer merge.** 🔧
            
            Verifique os logs do workflow para mais detalhes.`;
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: message
          });

    - name: Bloquear merge se testes falharam
      if: steps.tests.outputs.test_status != 'success'
      run: |
        echo "❌ Merge bloqueado devido a falhas nos testes"
        exit 1